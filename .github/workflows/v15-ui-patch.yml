name: V15 one-shot UI refactor

on:
  push:
    branches: [agent/v15-inventory-grounded-agentic-ux]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry V15 inventory UI patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v15-inventory-grounded-agentic-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact V15 UI refactor
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('components/travel-decision-experience.tsx')
          text=path.read_text()

          type_needle='type StreamEvent = { type: string; message?: string; result?: V8RecommendationResponse; continuity?: ContinuityEnvelope };\n'
          assert type_needle in text, 'StreamEvent anchor missing'
          text=text.replace(type_needle,type_needle+'type InventoryCityOption = { slug:string; value:string; label:string; propertyCount:number; offerCount:number; sourceCities:string[] };\n',1)

          state_needle='  const [error, setError] = useState<string | null>(null);\n'
          assert state_needle in text, 'state anchor missing'
          text=text.replace(state_needle,state_needle+'  const [cityOptions, setCityOptions] = useState<InventoryCityOption[]>([]);\n  const [cityLoading, setCityLoading] = useState(false);\n  const [cityError, setCityError] = useState<string | null>(null);\n',1)

          patch_anchor='  const patch = <K extends keyof TripRequest>(key: K, value: TripRequest[K]) => setTrip(current => ({ ...current, [key]: value }));\n'
          assert patch_anchor in text, 'patch function anchor missing'
          city_effect='''  useEffect(() => {\n    const controller = new AbortController();\n    let active = true;\n    setCityLoading(true);\n    setCityError(null);\n    fetch(`/api/stay-cities?lang=${lang}`, { signal: controller.signal, headers: { accept: "application/json" } })\n      .then(async response => { if (!response.ok) throw new Error(`city inventory ${response.status}`); return await response.json() as { cities?: InventoryCityOption[] }; })\n      .then(payload => {\n        if (!active) return;\n        const options = Array.isArray(payload.cities) ? payload.cities.filter(option => option.propertyCount > 0 && option.offerCount > 0) : [];\n        setCityOptions(options);\n        setTrip(current => {\n          if (current.entryMode !== "idea" || !current.consideredDestination) return current;\n          const raw = current.consideredDestination.toLocaleLowerCase("el");\n          const matched = options.find(option => option.value === current.consideredDestination || option.label.toLocaleLowerCase("el") === raw);\n          return matched ? { ...current, consideredDestination: matched.value } : { ...current, consideredDestination: undefined };\n        });\n      })\n      .catch(error => { if (active && error?.name !== "AbortError") { setCityOptions([]); setCityError(say(lang, "Δεν μπορώ να επιβεβαιώσω τις πόλεις με καταλύματα αυτή τη στιγμή.", "I cannot verify accommodation-backed cities right now.")); } })\n      .finally(() => { if (active) setCityLoading(false); });\n    return () => { active = false; controller.abort(); };\n  }, [lang]);\n\n'''
          text=text.replace(patch_anchor,city_effect+patch_anchor,1)

          replacement='''          {entryMode === "idea" && <Question title={say(lang,"Ποια πόλη έχεις στο μυαλό σου;","Which city do you have in mind?")} hint={say(lang,"Εμφανίζονται μόνο προορισμοί που έχουν τώρα πραγματικά καταλύματα στο ενεργό inventory. Η επιλογή εξετάζεται — δεν εξαναγκάζεται να κερδίσει.","Only destinations with real accommodation in the active inventory are shown. Your idea is considered, never forced to win.")}><div className="inventory-city-control"><select aria-label={say(lang,"Πόλη με ενεργά καταλύματα","City with active accommodation")} value={trip.consideredDestination??""} disabled={cityLoading||cityOptions.length===0} onChange={event=>patch("consideredDestination",event.target.value||undefined)}><option value="">{cityLoading?say(lang,"Ελέγχω το ενεργό inventory…","Checking active inventory…"):say(lang,"Διάλεξε πόλη / προορισμό","Choose a city / destination")}</option>{cityOptions.map(option=><option key={option.slug} value={option.value}>{option.label} · {option.propertyCount} {say(lang,"καταλύματα","stays")}</option>)}</select><div className="inventory-city-proof" aria-live="polite">{cityError?<span className="inventory-city-error">{cityError}</span>:cityOptions.length>0?<span><ShieldCheck size={17} weight="duotone" /> {say(lang,`${cityOptions.length} προορισμοί επιβεβαιώθηκαν από ενεργά καταλύματα`,`${cityOptions.length} destinations verified from active accommodation`)}</span>:null}</div></div></Question>}\n'''
          lines=text.splitlines(keepends=True)
          matches=[index for index,line in enumerate(lines) if 'className="destination-input"' in line]
          assert len(matches)==1, f'expected one legacy destination input line, found {len(matches)}'
          lines[matches[0]]=replacement
          text=''.join(lines)

          replacements={
            'Η Ψυχολόγος του ταξιδιού διαβάζει πίσω από τις απαντήσεις':'Ο Intent Agent μεταφράζει τι πραγματικά ζητάς',
            'Your travel psychologist reads between the answers':'The Intent Agent translates what you really need',
            'Ο Explorer ανοίγει όλη την Ελλάδα':'Ο Orchestrator ανοίγει τον επαληθευμένο ελληνικό κατάλογο',
            'The Explorer opens up all of Greece':'The Orchestrator opens the verified Greek catalog',
            'Ο Matchmaker κράτησε μόνο όσα έχουν προσωπικό λόγο':'Το Decision Engine κράτησε μόνο τα πραγματικά βιώσιμα matches',
            'The Matchmaker kept only meaningful fits':'The Decision Engine kept only viable matches',
            'Ο Season Keeper ελέγχει αν οι ημερομηνίες στέκουν':'Ο Season & Route Analyst ελέγχει εποχή και μετάβαση',
            'The Season Keeper checks whether the dates work':'The Season & Route Analyst checks season and travel effort',
            'Ο Skeptic ψάχνει λόγο να απορρίψει τις επιλογές':'Ο Skeptical Auditor προσπαθεί να απορρίψει αδύναμες επιλογές',
            'The Skeptic looks for reasons to reject the choices':'The Skeptical Auditor tries to reject weak choices',
          }
          for old,new in replacements.items():
            assert old in text, f'missing stage label: {old}'
            text=text.replace(old,new,1)

          weather_line='  "weather:ready": ["Καιρός και εποχή πέρασαν τον έλεγχο", "Weather and season passed the check"],\n'
          assert weather_line in text, 'weather stage anchor missing'
          text=text.replace(weather_line,weather_line+'  "research:start": ["Ο Research Scout ψάχνει πραγματικές πηγές για τους finalists", "The Research Scout checks real sources for the finalists"],\n  "research:ready": ["Η έρευνα επέστρεψε grounded evidence — όχι μνήμη μοντέλου", "Research returned grounded evidence — not model memory"],\n',1)

          path.write_text(text)

          css=Path('app/v8.css')
          css_text=css.read_text()
          marker='/* V15 inventory-grounded city selector */'
          assert marker not in css_text, 'V15 city styles already present'
          css_text += '''\n\n/* V15 inventory-grounded city selector */\n.inventory-city-control{display:grid;gap:.65rem;max-width:780px}\n.inventory-city-control select{width:100%;min-height:52px;border:1px solid rgba(120,215,255,.28);border-radius:16px;background:rgba(7,20,40,.92);color:#f7fbff;padding:.82rem 2.8rem .82rem 1rem;font:inherit;line-height:1.25;box-shadow:inset 0 1px 0 rgba(255,255,255,.04);outline:none}\n.inventory-city-control select:focus-visible{border-color:#7bdcff;box-shadow:0 0 0 3px rgba(123,220,255,.18)}\n.inventory-city-control select:disabled{opacity:.62;cursor:progress}\n.inventory-city-proof{min-height:24px;font-size:.84rem;color:rgba(226,241,255,.75)}\n.inventory-city-proof span{display:flex;align-items:center;gap:.4rem}\n.inventory-city-error{color:#ffb7c4}\n@media(max-width:640px){.inventory-city-control select{min-height:50px;border-radius:14px;font-size:16px}}\n'''
          css.write_text(css_text)
          PY
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:stay-cities
      - run: git diff --check
      - name: Commit UI refactor
        run: |
          git config user.name "travel-ai-auditor"
          git config user.email "68458826+vmoulakakis@users.noreply.github.com"
          git add components/travel-decision-experience.tsx app/v8.css
          git commit -m "Bind city field to active stay inventory [ui-patch]"
          git push origin HEAD:agent/v15-inventory-grounded-agentic-ux
