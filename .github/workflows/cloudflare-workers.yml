name: Cloudflare Workers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENNEXT_VERSION: "1.20.2"
  WRANGLER_VERSION: "4.123.0"

jobs:
  validate:
    name: Workers dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Install pinned Cloudflare build toolchain
        run: npm install --no-save --package-lock=false @opennextjs/cloudflare@${OPENNEXT_VERSION} wrangler@${WRANGLER_VERSION}
      - name: Build OpenNext Worker bundle
        run: npx opennextjs-cloudflare build
      - name: Validate Worker bundle without publishing
        run: >-
          npx wrangler deploy --dry-run
          --var DEPLOYMENT_PLATFORM:cloudflare-workers
          --var DEPLOYMENT_ENV:ci
          --var DEPLOYMENT_COMMIT:${GITHUB_SHA}

  deploy:
    name: Workers production deploy
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Install pinned Cloudflare build toolchain
        run: npm install --no-save --package-lock=false @opennextjs/cloudflare@${OPENNEXT_VERSION} wrangler@${WRANGLER_VERSION}
      - name: Check Cloudflare deployment credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deploy skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets/variables."
          fi
      - name: Build OpenNext Worker bundle
        if: steps.credentials.outputs.ready == 'true'
        run: npx opennextjs-cloudflare build
      - name: Deploy travel-ai to Cloudflare Workers
        if: steps.credentials.outputs.ready == 'true'
        run: >-
          npx wrangler deploy
          --var DEPLOYMENT_PLATFORM:cloudflare-workers
          --var DEPLOYMENT_ENV:production
          --var DEPLOYMENT_COMMIT:${GITHUB_SHA}
