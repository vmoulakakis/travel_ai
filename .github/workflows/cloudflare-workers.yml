name: Cloudflare Workers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENNEXT_VERSION: "1.20.2"
  WRANGLER_VERSION: "4.123.0"

jobs:
  validate:
    name: Workers dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Install pinned Cloudflare build toolchain
        run: npm install --no-save --package-lock=false @opennextjs/cloudflare@${OPENNEXT_VERSION} wrangler@${WRANGLER_VERSION}
      - name: Build OpenNext Worker bundle
        run: npx opennextjs-cloudflare build
      - name: Validate Worker bundle without publishing
        run: >-
          npx wrangler deploy --dry-run
          --var DEPLOYMENT_PLATFORM:cloudflare-workers
          --var DEPLOYMENT_ENV:ci
          --var DEPLOYMENT_COMMIT:${GITHUB_SHA}

  deploy:
    name: Workers production deploy
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Same Cloudflare account already used by the SocialMarket Worker integration.
      CLOUDFLARE_ACCOUNT_ID: "62e9019c4e0933db5716b32ae0939d7d"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Install pinned Cloudflare build toolchain
        run: npm install --no-save --package-lock=false @opennextjs/cloudflare@${OPENNEXT_VERSION} wrangler@${WRANGLER_VERSION}
      - name: Require Cloudflare deployment token
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Production publish blocked: configure repository secret CLOUDFLARE_API_TOKEN with Workers Scripts write access for the existing Cloudflare account."
            exit 1
          fi
      - name: Build OpenNext Worker bundle
        run: npx opennextjs-cloudflare build
      - name: Deploy travel-ai to Cloudflare Workers
        run: >-
          npx wrangler deploy
          --var DEPLOYMENT_PLATFORM:cloudflare-workers
          --var DEPLOYMENT_ENV:production
          --var DEPLOYMENT_COMMIT:${GITHUB_SHA}
