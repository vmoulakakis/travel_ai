name: V16 exact type fix

on:
  push:
    branches: [agent/v16-hard-stay-constraints-cost-router]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry V16 exact type fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v16-hard-stay-constraints-cost-router
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact compiler and Greek hard-language fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('lib/ai/intent-v8.ts')
          s=p.read_text()
          old='context:{task:"intent",text,deterministicConfidence,hardConstraintRisk,contradictorySignals:clauses>=4}'
          new='context:{task:"intent",text,deterministicConfidence,hardConstraintRisk:hardRisk,contradictorySignals:clauses>=4}'
          assert old in s
          s=s.replace(old,new,1)
          old='const hardRisk=/\\b(?:μονο|only|mono|χωρις|without|must|οπωσδηποτε)\\b/i.test(normalized);'
          new='const hardRisk=/(?:μονο|χωρις|οπωσδηποτε|\\b(?:only|mono|without|must)\\b)/i.test(normalized);'
          assert old in s
          p.write_text(s.replace(old,new,1))

          p=Path('lib/ai/recommendation-research-agent-v14.ts')
          s=p.read_text()
          old='new ToolLoopAgent({model:route.model,instructions,tools:{searchTravelEvidence}'
          new='new ToolLoopAgent({model:route.model,maxOutputTokens:route.maxOutputTokens,instructions,tools:{searchTravelEvidence}'
          assert old in s
          s=s.replace(old,new,1)
          old=',abortSignal:controller.signal,maxOutputTokens:route.maxOutputTokens});'
          new=',abortSignal:controller.signal});'
          assert old in s
          s=s.replace(old,new,1)
          old='hardLanguage=/\\b(?:μονο|only|mono|χωρις|without|must|οπωσδηποτε)\\b/i.test(request.tripText??"")'
          new='hardLanguage=/(?:μονο|χωρις|οπωσδηποτε|\\b(?:only|mono|without|must)\\b)/i.test(request.tripText??"")'
          assert old in s
          p.write_text(s.replace(old,new,1))

          p=Path('lib/ai/travel-council-v9.ts')
          s=p.read_text()
          old='new ToolLoopAgent({model:route.model,instructions,tools:{inspectEvidence}'
          new='new ToolLoopAgent({model:route.model,maxOutputTokens:route.maxOutputTokens,instructions,tools:{inspectEvidence}'
          assert old in s
          s=s.replace(old,new,1)
          old=',abortSignal:controller.signal,maxOutputTokens:route.maxOutputTokens});'
          new=',abortSignal:controller.signal});'
          assert old in s
          s=s.replace(old,new,1)
          old='hardLanguage=/\\b(?:μονο|only|mono|χωρις|without|must|οπωσδηποτε)\\b/i.test(request.tripText??"")'
          new='hardLanguage=/(?:μονο|χωρις|οπωσδηποτε|\\b(?:only|mono|without|must)\\b)/i.test(request.tripText??"")'
          assert old in s
          p.write_text(s.replace(old,new,1))

          p=Path('lib/ai/openai-verifier-v8.ts')
          s=p.read_text()
          old='hardLanguage=/\\b(?:μονο|only|mono|χωρις|without|must|οπωσδηποτε)\\b/i.test(request.tripText??"")'
          new='hardLanguage=/(?:μονο|χωρις|οπωσδηποτε|\\b(?:only|mono|without|must)\\b)/i.test(request.tripText??"")'
          assert old in s
          p.write_text(s.replace(old,new,1))

          p=Path('lib/ai/model-router-v9.ts')
          s=p.read_text()
          old='if(/\\b(?:μονο|only|mono|χωρις|without|εκτος|except|must|οπωσδηποτε)\\b/.test(text))risk+=.12;'
          new='if(/(?:μονο|χωρις|εκτος|οπωσδηποτε|\\b(?:only|mono|without|except|must)\\b)/.test(text))risk+=.12;'
          assert old in s
          p.write_text(s.replace(old,new,1))

          p=Path('lib/decision/stay-constraints-v16.ts')
          s=p.read_text()
          old='export const STAY_EXCLUSIVE_V16=/(?:\\bμονο\\b|\\bαποκλειστικ|\\bοπωσδηποτε\\b|\\bmust\\b|\\bonly\\b|\\bstrictly\\b|\\bmono\\b|\\bapokleistik)/i;'
          new='export const STAY_EXCLUSIVE_V16=/(?:μονο|αποκλειστικ|οπωσδηποτε|\\bmust\\b|\\bonly\\b|\\bstrictly\\b|\\bmono\\b|\\bapokleistik)/i;'
          assert old in s
          s=s.replace(old,new,1)
          start=s.index('function hasScopedExclusivity(')
          end=s.index('\n}\n\nexport function parseStayConstraintsV16',start)+2
          old_block=s[start:end]
          new_block='''function hasScopedExclusivity(text:string,kind:StayConstraintKind){
 const n=norm(text),terms:Record<StayConstraintKind,string[]>={
  BEACHFRONT:["beachfront","sea front","θαλασσ","παραλι","thalass","parali"],NEAR_BEACH:["παραλι","θαλασσ","beach","parali","thalass"],SEA_VIEW:["sea view","θεα","thea"],POOL:["pool","πισιν","pisin"],PARKING:["parking","παρκιν"],EV_CHARGING:["φορτι","charg","forti"],BREAKFAST:["breakfast","πρωιν","proin"],PET_FRIENDLY:["pet","κατοικιδ","katoikid"],FAMILY_ROOM:["family room","οικογενειακ","oikogeneiak"],ADULTS_ONLY:["adults only","ενηλικ","enilik"]};
 const clauses=n.split(/\\s+(?:και|and|αλλα|but)\\s+|[,;]/).map(value=>value.trim()).filter(Boolean);
 return clauses.some(clause=>STAY_EXCLUSIVE_V16.test(clause)&&terms[kind].some(term=>clause.includes(term)));
}'''
          assert 'STAY_NOUN_V16.test(text)&&mentions(kind,text)' in old_block
          s=s[:start]+new_block+s[end:]
          p.write_text(s)

          p=Path('lib/ai/travel-orchestrator-v15.ts')
          s=p.read_text()
          old='import { interpretStayConstraintsV16 } from "@/lib/decision/stay-constraints-v16";'
          new='import { interpretStayConstraintsV16 } from "@/lib/ai/stay-constraint-interpreter-v16";'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:v16:stay
      - run: npm run test:v16:router
      - run: git diff --check
      - name: Commit fixes
        run: |
          git config user.name "travel-ai-auditor"
          git config user.email "68458826+vmoulakakis@users.noreply.github.com"
          git add lib/ai/intent-v8.ts lib/ai/recommendation-research-agent-v14.ts lib/ai/travel-council-v9.ts lib/ai/openai-verifier-v8.ts lib/ai/model-router-v9.ts lib/ai/travel-orchestrator-v15.ts lib/decision/stay-constraints-v16.ts
          git commit -m "Fix Greek hard-language detection and V16 SDK typing"
          git push origin HEAD:agent/v16-hard-stay-constraints-cost-router
