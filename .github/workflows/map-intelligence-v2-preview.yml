name: Map Intelligence v2 Preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/map-intelligence-v2-preview.yml"
      - "components/map-intelligence-v2.tsx"
      - "components/map-intelligence-v2.module.css"
      - "app/map-intelligence-v2/**"

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_jt3jd1HJUB4sK1oZdl9MUYGs
      VERCEL_PROJECT_ID: prj_wGO5Tq3kQxrUMi7WA3lvTHxTNGhn
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Pull preview environment
        run: npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build preview
        run: npx --yes vercel@latest build --token="$VERCEL_TOKEN"
      - name: Deploy preview
        run: |
          URL=$(npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "Preview URL: $URL"
          echo "### TravelAI Map Intelligence v2" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL/map-intelligence-v2" >> "$GITHUB_STEP_SUMMARY"
