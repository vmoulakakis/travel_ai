name: Production Sync

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: travel-ai-production-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: Production – travel-ai
    env:
      VERCEL_ORG_ID: team_jt3jd1HJUB4sK1oZdl9MUYGs
      VERCEL_PROJECT_ID: prj_wGO5Tq3kQxrUMi7WA3lvTHxTNGhn
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Require Vercel credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is missing."
            exit 1
          fi

      - name: Check whether production is already current
        id: drift
        shell: bash
        run: |
          response="$(curl -fsS             -H "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&limit=1")"
          prod_sha="$(printf '%s' "$response" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s);
              const d=Array.isArray(j.deployments)?j.deployments[0]:null;
              process.stdout.write(d?.meta?.githubCommitSha||"");
            })')"
          echo "main_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "prod_sha=$prod_sha" >> "$GITHUB_OUTPUT"
          if [ "$prod_sha" = "$GITHUB_SHA" ]; then
            echo "needs_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Production already matches $GITHUB_SHA"
          else
            echo "needs_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Production drift detected: ${prod_sha:-none} -> $GITHUB_SHA"
          fi

      - uses: actions/setup-node@v5
        if: steps.drift.outputs.needs_deploy == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.drift.outputs.needs_deploy == 'true'
        run: npm ci --no-audit --no-fund

      - name: Validate
        if: steps.drift.outputs.needs_deploy == 'true'
        run: |
          npm run typecheck
          npm run test:strict

      - name: Pull Vercel production environment
        if: steps.drift.outputs.needs_deploy == 'true'
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        if: steps.drift.outputs.needs_deploy == 'true'
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifact
        if: steps.drift.outputs.needs_deploy == 'true'
        id: deploy
        shell: bash
        run: |
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $GITHUB_SHA to $url"

      - name: Verify deployed SHA
        if: steps.drift.outputs.needs_deploy == 'true'
        shell: bash
        run: |
          sleep 8
          response="$(curl -fsS             -H "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&limit=1")"
          prod_sha="$(printf '%s' "$response" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s);
              const d=Array.isArray(j.deployments)?j.deployments[0]:null;
              process.stdout.write(d?.meta?.githubCommitSha||"");
            })')"
          if [ "$prod_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Production SHA mismatch after deploy: $prod_sha != $GITHUB_SHA"
            exit 1
          fi
          echo "Production verified at $prod_sha"
