name: Escape Book pre-deployment verification
on:
  push:
    branches:
      - feature/escape-book-experience-20261008
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:escape-book
      - run: npm run typecheck
      - run: npm run test:v50:agent
      - run: npm run build
