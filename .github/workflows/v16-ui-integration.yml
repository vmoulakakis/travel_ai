name: V16 UI integration

on:
  push:
    branches:
      - agent/v16-hard-stay-constraints-cost-router

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run V16 UI integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v16-hard-stay-constraints-cost-router
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact V16 UI and server-boundary patch
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('lib/ai/travel-orchestrator-v15.ts')
          s=p.read_text()
          old='import { interpretStayConstraintsV16 } from "@/lib/decision/stay-constraints-v16";'
          new='import { interpretStayConstraintsV16 } from "@/lib/ai/stay-constraint-interpreter-v16";'
          assert old in s, 'orchestrator import anchor missing'
          p.write_text(s.replace(old,new,1))

          p=Path('components/travel-decision-experience.tsx')
          s=p.read_text()
          old='import type { V8Recommendation, V8RecommendationResponse, V8StayOffer, V8StayResponse } from "@/lib/decision/v8-types";\nimport { scoreStayOffer } from "@/lib/decision/stay-offer-score";'
          new='import type { StayConstraintKind, V8Recommendation, V8RecommendationResponse, V8StayOffer, V8StayResponse } from "@/lib/decision/v8-types";\nimport { scoreStayOffer } from "@/lib/decision/stay-offer-score";\nimport { evaluateStayOfferV16 } from "@/lib/decision/stay-constraints-v16";'
          assert old in s, 'import anchor missing'
          s=s.replace(old,new,1)

          old='const prettyDate = (iso: string, lang: Lang) => new Intl.DateTimeFormat(lang === "el" ? "el-GR" : "en-GB", { day: "numeric", month: "short" }).format(new Date(`${iso}T12:00:00Z`));\n'
          new=old+'''const stayRequirementLabel=(kind:StayConstraintKind,lang:Lang)=>({\n  BEACHFRONT:["Μπροστά στη θάλασσα","Beachfront"],NEAR_BEACH:["Κοντά στην παραλία","Near the beach"],SEA_VIEW:["Θέα θάλασσα","Sea view"],POOL:["Πισίνα","Pool"],PARKING:["Parking","Parking"],EV_CHARGING:["Φόρτιση EV","EV charging"],BREAKFAST:["Πρωινό","Breakfast"],PET_FRIENDLY:["Pet friendly","Pet friendly"],FAMILY_ROOM:["Οικογενειακό δωμάτιο","Family room"],ADULTS_ONLY:["Adults only","Adults only"]\n}[kind][lang==="el"?0:1]);\n'''
          assert old in s, 'helper anchor missing'
          s=s.replace(old,new,1)

          old='  "shortlist:ready": ["Το Decision Engine κράτησε μόνο τα πραγματικά βιώσιμα matches", "The Decision Engine kept only viable matches"],\n'
          new=old+'  "stay:start": ["Ο Stay Evidence Agent ελέγχει τα υποχρεωτικά κριτήρια διαμονής", "The Stay Evidence Agent checks mandatory accommodation requirements"],\n  "stay:ready": ["Έμειναν μόνο προορισμοί με επαληθευμένο κατάλυμα για τα hard criteria", "Only destinations with evidence-backed stays for the hard requirements remain"],\n'
          assert old in s, 'stage anchor missing'
          s=s.replace(old,new,1)

          old='''  const stayOffers = useMemo(() => {\n    return [...(stayData?.offers ?? [])]\n      .filter(offer => (!offer.validFrom || Date.parse(offer.validFrom) <= Date.parse(`${trip.startDate}T23:59:59Z`)) && Boolean(offer.validTo) && Date.parse(offer.validTo as string) >= Date.parse(`${trip.endDate}T00:00:00Z`) && offer.trackingUrl.startsWith("https://go.linkwi.se/") && offer.trackingUrl.includes("/CD104/"))\n      .sort((a, b) => scoreStayOffer(b, trip.hotelStyle, trip.stayLocationPreference) - scoreStayOffer(a, trip.hotelStyle, trip.stayLocationPreference))\n      .slice(0, 3);\n  }, [stayData, trip.startDate, trip.endDate, trip.hotelStyle, trip.stayLocationPreference]);\n'''
          new='''  const stayOffers = useMemo(() => {\n    const valid=[...(stayData?.offers ?? [])].filter(offer => (!offer.validFrom || Date.parse(offer.validFrom) <= Date.parse(`${trip.startDate}T23:59:59Z`)) && Boolean(offer.validTo) && Date.parse(offer.validTo as string) >= Date.parse(`${trip.endDate}T00:00:00Z`) && offer.trackingUrl.startsWith("https://go.linkwi.se/") && offer.trackingUrl.includes("/CD104/"));\n    const requirements=result?.stayRequirements;\n    const eligible=requirements?.hard.length?valid.filter(offer=>evaluateStayOfferV16(offer,requirements).passed):valid;\n    return eligible.sort((a, b) => scoreStayOffer(b, trip.hotelStyle, trip.stayLocationPreference) - scoreStayOffer(a, trip.hotelStyle, trip.stayLocationPreference)).slice(0, 3);\n  }, [stayData, trip.startDate, trip.endDate, trip.hotelStyle, trip.stayLocationPreference, result?.stayRequirements]);\n'''
          assert old in s, 'stayOffers anchor missing'
          s=s.replace(old,new,1)

          s=s.replace('Δεν μπορώ να επιβεβαιώσω τις πόλεις με καταλύματα αυτή τη στιγμή.','Δεν μπορώ να επιβεβαιώσω τις τοποθεσίες με καταλύματα αυτή τη στιγμή.',1)
          s=s.replace('I cannot verify accommodation-backed cities right now.','I cannot verify accommodation-backed locations right now.',1)

          old='{entryMode === "idea" && <Question title={say(lang,"Ποια πόλη έχεις στο μυαλό σου;","Which city do you have in mind?")} hint={say(lang,"Εμφανίζονται μόνο προορισμοί που έχουν τώρα πραγματικά καταλύματα στο ενεργό inventory. Η επιλογή εξετάζεται — δεν εξαναγκάζεται να κερδίσει.","Only destinations with real accommodation in the active inventory are shown. Your idea is considered, never forced to win.")}><div className="inventory-city-control"><select aria-label={say(lang,"Πόλη με ενεργά καταλύματα","City with active accommodation")} value={trip.consideredDestination??""} disabled={cityLoading||cityOptions.length===0} onChange={event=>patch("consideredDestination",event.target.value||undefined)}><option value="">{cityLoading?say(lang,"Ελέγχω το ενεργό inventory…","Checking active inventory…"):say(lang,"Διάλεξε πόλη / προορισμό","Choose a city / destination")}</option>{cityOptions.map(option=><option key={option.slug} value={option.value}>{option.label} · {option.propertyCount} {say(lang,"καταλύματα","stays")}</option>)}</select><div className="inventory-city-proof" aria-live="polite">{cityError?<span className="inventory-city-error">{cityError}</span>:cityOptions.length>0?<span><ShieldCheck size={17} weight="duotone" /> {say(lang,`${cityOptions.length} προορισμοί επιβεβαιώθηκαν από ενεργά καταλύματα`,`${cityOptions.length} destinations verified from active accommodation`)}</span>:null}</div></div></Question>}'
          new='{entryMode === "idea" && <Question title={say(lang,"Πού σκέφτεσαι να μείνεις;","Where are you thinking of staying?")} hint={say(lang,"Εμφανίζονται μόνο προορισμοί ή περιοχές που συνδέονται τώρα με πραγματικά καταλύματα στο ενεργό inventory. Δεν ονομάζουμε νησί ή περιοχή «πόλη». Η επιλογή εξετάζεται — δεν εξαναγκάζεται να κερδίσει.","Only destinations or areas currently backed by real accommodation inventory are shown. Islands and regions are not mislabeled as cities. Your idea is considered, never forced to win.")}><div className="inventory-city-control"><select aria-label={say(lang,"Προορισμός ή περιοχή με ενεργά καταλύματα","Destination or area with active accommodation")} value={trip.consideredDestination??""} disabled={cityLoading||cityOptions.length===0} onChange={event=>patch("consideredDestination",event.target.value||undefined)}><option value="">{cityLoading?say(lang,"Ελέγχω το ενεργό inventory…","Checking active inventory…"):say(lang,"Διάλεξε προορισμό / περιοχή","Choose a destination / area")}</option>{cityOptions.map(option=><option key={option.slug} value={option.value}>{option.label} · {option.propertyCount} {say(lang,"καταλύματα","stays")}</option>)}</select><div className="inventory-city-proof" aria-live="polite">{cityError?<span className="inventory-city-error">{cityError}</span>:cityOptions.length>0?<span><ShieldCheck size={17} weight="duotone" /> {say(lang,`${cityOptions.length} προορισμοί/περιοχές συνδέθηκαν με ενεργά καταλύματα`,`${cityOptions.length} destinations/areas linked to active accommodation`)}</span>:null}</div></div></Question>}'
          assert old in s, 'city selector anchor missing'
          s=s.replace(old,new,1)

          old='        {result.feasibility==="COMPROMISE"&&<div className="feasibility-note">'
          new='        {result.stayRequirements?.hard.length?<div className="hard-stay-requirement" role="status"><ShieldCheck size={23} weight="duotone"/><div><strong>{say(lang,"Υποχρεωτικό κριτήριο διαμονής — δεν χαλαρώνει","Mandatory stay requirement — never relaxed")}</strong><span>{result.stayRequirements.hard.map(kind=>stayRequirementLabel(kind,lang)).join(" · ")}</span><small>{say(lang,"Οι finalists πέρασαν μόνο αν βρέθηκε κατάλυμα με άμεσο evidence για όλες τις ημερομηνίες.","Finalists survived only when a stay had direct evidence for every trip date.")}</small></div></div>:null}\n        {result.feasibility==="COMPROMISE"&&<div className="feasibility-note">'
          assert old in s, 'result proof anchor missing'
          s=s.replace(old,new,1)

          old='  const selectedOffer=offers.find(offer=>offer.sourceProductId===selectedOfferId)??null;\n'
          new=old+'  const hardStayRequirements=result.stayRequirements?.hard??[];\n'
          assert old in s, 'destination stay requirements anchor missing'
          s=s.replace(old,new,1)

          old='''      <div className="stay-head"><div><span className="eyebrow">{say(lang, "ΤΩΡΑ — ΚΑΙ ΜΟΝΟ ΤΩΡΑ — Η ΔΙΑΜΟΝΗ", "NOW — AND ONLY NOW — THE STAY")}</span><h3>{say(lang, "Τρεις επιλογές που υπηρετούν την απόφαση.", "Three stays that serve the decision.")}</h3></div><p>{say(lang, `Εμφανίζονται μόνο επιλογές που καλύπτουν ολόκληρο το ταξίδι ${prettyDate(trip.startDate, lang)}–${prettyDate(trip.endDate, lang)}. Η τελική διαθεσιμότητα δωματίου και τιμή επιβεβαιώνονται στην επόμενη σελίδα.`, `Only options covering the full trip ${prettyDate(trip.startDate, lang)}–${prettyDate(trip.endDate, lang)} are shown. Final room availability and price are confirmed on the next page.`)}</p></div>\n'''
          new='''      <div className="stay-head"><div><span className="eyebrow">{say(lang, "ΤΩΡΑ — ΚΑΙ ΜΟΝΟ ΤΩΡΑ — Η ΔΙΑΜΟΝΗ", "NOW — AND ONLY NOW — THE STAY")}</span><h3>{hardStayRequirements.length?say(lang,"Μόνο stays που αποδεικνύουν το υποχρεωτικό σου κριτήριο.","Only stays that prove your mandatory requirement."):say(lang, "Τρεις επιλογές που υπηρετούν την απόφαση.", "Three stays that serve the decision.")}</h3></div><p>{hardStayRequirements.length?say(lang,`Hard requirement: ${hardStayRequirements.map(kind=>stayRequirementLabel(kind,lang)).join(" · ")}. Δεν αρκεί να είναι παραθαλάσσιος ο προορισμός — χρειάζεται evidence στο ίδιο το κατάλυμα και κάλυψη ${prettyDate(trip.startDate,lang)}–${prettyDate(trip.endDate,lang)}.`,`Hard requirement: ${hardStayRequirements.map(kind=>stayRequirementLabel(kind,lang)).join(" · ")}. A coastal destination is not enough — the property itself needs evidence and full ${prettyDate(trip.startDate,lang)}–${prettyDate(trip.endDate,lang)} coverage.`):say(lang, `Εμφανίζονται μόνο επιλογές που καλύπτουν ολόκληρο το ταξίδι ${prettyDate(trip.startDate, lang)}–${prettyDate(trip.endDate, lang)}. Η τελική διαθεσιμότητα δωματίου και τιμή επιβεβαιώνονται στην επόμενη σελίδα.`, `Only options covering the full trip ${prettyDate(trip.startDate, lang)}–${prettyDate(trip.endDate, lang)} are shown. Final room availability and price are confirmed on the next page.`)}</p></div>\n'''
          assert old in s, 'stay head anchor missing'
          s=s.replace(old,new,1)

          old='<StayCard key={offer.sourceProductId} offer={offer} index={index} trip={trip} lang={lang} bookingEvidence={insights?.evidence?.booking.filter(item=>item.sourceProductId===offer.sourceProductId)??[]} selected={offer.sourceProductId===selectedOfferId} onSelect={()=>selectOffer(offer)} />'
          new='<StayCard key={offer.sourceProductId} offer={offer} index={index} trip={trip} lang={lang} stayRequirements={result.stayRequirements} bookingEvidence={insights?.evidence?.booking.filter(item=>item.sourceProductId===offer.sourceProductId)??[]} selected={offer.sourceProductId===selectedOfferId} onSelect={()=>selectOffer(offer)} />'
          assert old in s, 'StayCard invocation anchor missing'
          s=s.replace(old,new,1)

          old='<FinalDecisionFunnel offer={selectedOffer} recommendation={recommendation} trip={trip} lang={lang} onSelectWindow={onSelectWindow}/>'
          new='<FinalDecisionFunnel offer={selectedOffer} recommendation={recommendation} trip={trip} lang={lang} stayRequirements={result.stayRequirements} onSelectWindow={onSelectWindow}/>'
          assert old in s, 'funnel invocation anchor missing'
          s=s.replace(old,new,1)

          old='{say(lang, "Η πρόταση προορισμού παραμένει, αλλά αυτή τη στιγμή δεν υπάρχει stay που να περνά τον πλήρη έλεγχο ημερομηνιών.", "The destination recommendation stands, but there is currently no stay that passes the full date check.")}'
          new='{hardStayRequirements.length?say(lang,`Δεν υπάρχει τώρα stay που να αποδεικνύει ${hardStayRequirements.map(kind=>stayRequirementLabel(kind,lang)).join(" · ")} και να καλύπτει όλες τις ημερομηνίες. Δεν θα εμφανίσουμε χαλαρότερο substitute.`,`There is currently no stay proving ${hardStayRequirements.map(kind=>stayRequirementLabel(kind,lang)).join(" · ")} across every date. We will not show a looser substitute.`):say(lang, "Η πρόταση προορισμού παραμένει, αλλά αυτή τη στιγμή δεν υπάρχει stay που να περνά τον πλήρη έλεγχο ημερομηνιών.", "The destination recommendation stands, but there is currently no stay that passes the full date check.")}'
          assert old in s, 'no stays anchor missing'
          s=s.replace(old,new,1)

          old='function StayCard({ offer, index, trip, lang, bookingEvidence, selected, onSelect }: { offer: V8StayOffer; index: number; trip: TripRequest; lang: Lang; bookingEvidence: NonNullable<DestinationInsightsResponse["evidence"]>["booking"]; selected:boolean; onSelect:()=>void }) {'
          new='function StayCard({ offer, index, trip, lang, stayRequirements, bookingEvidence, selected, onSelect }: { offer: V8StayOffer; index: number; trip: TripRequest; lang: Lang; stayRequirements?:V8RecommendationResponse["stayRequirements"]; bookingEvidence: NonNullable<DestinationInsightsResponse["evidence"]>["booking"]; selected:boolean; onSelect:()=>void }) {'
          assert old in s, 'StayCard signature anchor missing'
          s=s.replace(old,new,1)

          old='  const[charging,setCharging]=useState<ChargingCheck|null>(null),needsCharging=trip.transportMode==="electric-car",chargingVerified=charging?.status==="AT_PROPERTY"||charging?.status==="NEARBY";\n'
          new=old+'  const stayEvaluation=stayRequirements?evaluateStayOfferV16(offer,stayRequirements):null,hardEvidence=(stayRequirements?.hard??[]).filter(kind=>Boolean(stayEvaluation?.evidence[kind]));\n'
          assert old in s, 'stay evaluation anchor missing'
          s=s.replace(old,new,1)

          old='{bookingEvidence.length>0&&<span><ShieldCheck size={16}/>{say(lang,"Επαληθεύτηκε παρουσία στο Booking","Booking presence verified")}</span>}</div>'
          new='{bookingEvidence.length>0&&<span><ShieldCheck size={16}/>{say(lang,"Επαληθεύτηκε παρουσία στο Booking","Booking presence verified")}</span>}{hardEvidence.map(kind=><span className="hard-stay-evidence" key={kind}><ShieldCheck size={16} weight="fill"/>{stayRequirementLabel(kind,lang)} · {say(lang,"evidence στο κατάλυμα","property evidence")}</span>)}</div>'
          assert old in s, 'stay trust anchor missing'
          s=s.replace(old,new,1)

          old='function FinalDecisionFunnel({offer,recommendation,trip,lang,onSelectWindow}:{offer:V8StayOffer|null;recommendation:V8Recommendation;trip:TripRequest;lang:Lang;onSelectWindow:(window:SmartDateWindow)=>Promise<void>}){'
          new='function FinalDecisionFunnel({offer,recommendation,trip,lang,stayRequirements,onSelectWindow}:{offer:V8StayOffer|null;recommendation:V8Recommendation;trip:TripRequest;lang:Lang;stayRequirements?:V8RecommendationResponse["stayRequirements"];onSelectWindow:(window:SmartDateWindow)=>Promise<void>}){'
          assert old in s, 'funnel signature anchor missing'
          s=s.replace(old,new,1)

          old='body:JSON.stringify({slug:recommendation.slug,offerId:offer.sourceProductId,startDate:trip.startDate,endDate:trip.endDate})'
          new='body:JSON.stringify({slug:recommendation.slug,offerId:offer.sourceProductId,startDate:trip.startDate,endDate:trip.endDate,stayRequirements})'
          assert old in s, 'availability request anchor missing'
          s=s.replace(old,new,1)

          old='  useEffect(()=>{setAvailability(null)},[offer?.sourceProductId,trip.startDate,trip.endDate]);\n'
          new='  useEffect(()=>{setAvailability(null)},[offer?.sourceProductId,trip.startDate,trip.endDate,stayRequirements]);\n'
          assert old in s, 'availability reset anchor missing'
          s=s.replace(old,new,1)

          p.write_text(s)

          css=Path('app/v8.css')
          c=css.read_text()
          marker='/* V16 hard stay evidence */'
          assert marker not in c, 'V16 styles already present'
          c+='''\n\n/* V16 hard stay evidence */\n.hard-stay-requirement{display:flex;gap:.8rem;align-items:flex-start;margin:1rem 0 1.35rem;padding:1rem 1.1rem;border:1px solid rgba(20,95,74,.2);border-radius:18px;background:rgba(235,247,241,.78)}\n.hard-stay-requirement>div{display:grid;gap:.2rem}.hard-stay-requirement strong{font-size:.94rem}.hard-stay-requirement span{font-weight:700}.hard-stay-requirement small{opacity:.75;line-height:1.45}\n.hard-stay-evidence{font-weight:700!important;border-color:rgba(35,125,92,.22)!important;background:rgba(228,247,238,.75)!important}\n@media(max-width:640px){.hard-stay-requirement{border-radius:15px;padding:.85rem}.hard-stay-requirement small{font-size:.78rem}}\n'''
          css.write_text(c)
          PY
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:v16:stay
      - run: npm run test:v16:router
      - run: git diff --check
      - name: Commit validated integration
        run: |
          git config user.name "travel-ai-auditor"
          git config user.email "68458826+vmoulakakis@users.noreply.github.com"
          git add lib/ai/travel-orchestrator-v15.ts components/travel-decision-experience.tsx app/v8.css
          git commit -m "Bind V16 hard stay evidence into the user journey"
          git push origin HEAD:agent/v16-hard-stay-constraints-cost-router
