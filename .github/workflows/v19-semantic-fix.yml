name: V19 semantic fix validation
on:
  push:
    branches: [agent/v19-10000-match-audit]
    paths: [.github/workflows/v19-semantic-fix.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v19-10000-match-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/v19-route-and-clarify.py
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:v16:router
      - run: npm run test:v18:semantic
      - run: npm run test:v19:match10000
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/ai/intent-v8.ts lib/ai/travel-orchestrator-v15.ts scripts/v19-10000-semantic-match-audit.ts
          git diff --cached --check
          git commit -m "Add confidence-based semantic escalation and clarification"
          git push
