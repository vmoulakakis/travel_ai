name: V19 apply orchestrator patch
on:
  push:
    branches: [agent/v19-10000-match-audit]
    paths: [.github/workflows/v19-apply-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v19-10000-match-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/v19-patch-orchestrator.py
      - run: npm install
      - run: npm run typecheck
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/ai/travel-orchestrator-v15.ts
          git diff --cached --check
          git commit -m "Fix V18 hard geography enforcement before semantic ranking"
          git push
