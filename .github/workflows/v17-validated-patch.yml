name: V17 validated patch

on:
  push:
    branches:
      - agent/v17-1000-choice-audit-share

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run V17 validated patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v17-1000-choice-audit-share
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply V17 source patch
        run: python scripts/v17-apply-patch.py
      - name: Remove unsupported generated taxonomy assumption
        run: python scripts/v17-generated-hotfix.py
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:v17:choice1000
      - run: npm run test:v15:1000
      - run: npm run test:v16:stay1000
      - run: npm run build
      - run: git diff --check
      - name: Commit validated V17 changes
        run: |
          git config user.name "travel-ai-auditor"
          git config user.email "68458826+vmoulakakis@users.noreply.github.com"
          git add lib/decision/v8-matcher.ts lib/ai/travel-orchestrator-v15.ts lib/ai/result-auditor-v10.ts lib/ai/intent-v8.ts scripts/v17-1000-choice-audit.ts components/travel-decision-experience.tsx app/v8.css
          git commit -m "Improve choice fidelity and add explicit share buttons"
          git push origin HEAD:agent/v17-1000-choice-audit-share