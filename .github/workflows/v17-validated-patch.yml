name: V17 validated patch

on:
  push:
    branches:
      - agent/v17-1000-choice-audit-share

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run V17 validated patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v17-1000-choice-audit-share
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply V17 audit corrections and share UX
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Ranking: make nuanced free text affect selection and preserve a feasible explicit idea.
          p=Path('lib/decision/v8-matcher.ts')
          s=p.read_text()
          anchor='function consideredFit(r:TripRequest,d:V8Destination){const candidate=norm(r.consideredDestination??"");if(!candidate)return false;return[norm(d.slug),norm(d.nameEl),norm(d.nameEn),...d.aliases.map(norm)].some(value=>value===candidate||value.includes(candidate)||candidate.includes(value))}\n'
          add=anchor+'''function freeTextPreferenceAdjustment(r:TripRequest,d:V8Destination,effortScore:number){\n const text=norm(r.tripText??"");if(!text)return 0;let delta=0;\n const antiCrowd=/(?:tourist trap|no party crowds|not chaos|χωρις πολυ κοσμο|oxi poly kosmo|οχι πολυ κοσμο)/i.test(text);\n if(antiCrowd)delta+=d.crowdLevel<=3?6:d.crowdLevel>=5?-12:-2;\n const slowRhythm=/(?:easy rhythm|slow morning|μαραθωνιο|marathon|χωρις πολυ αγχος|xwris poly agxos|οχι προγραμμα μαραθωνιο)/i.test(text);\n if(slowRhythm){if(d.tags.includes("relax"))delta+=5;if(d.tags.includes("nightlife"))delta-=4;}\n const authentic=/(?:local character|αυθεντικ|τοπικ.{0,12}χαρακτηρ|not a generic resort|generic resort|local tavern|ταβερν)/i.test(text);\n if(authentic){if(d.tags.includes("culture"))delta+=5;if(d.crowdLevel<=3)delta+=2;if(d.tags.includes("resort")&&/(?:not a generic resort|generic resort)/i.test(text))delta-=6;}\n if(/(?:walkable|βολτα|volta)/i.test(text)){if(d.tags.includes("city"))delta+=3;if(d.tags.includes("culture"))delta+=2;}\n if(/(?:χωρις.{0,18}δυσκολ.{0,18}μεταβ|xwris.{0,18}dyskol.{0,18}metav|without.{0,18}difficult.{0,18}travel)/i.test(text))delta+=effortScore>=80?5:effortScore<60?-8:0;\n if(/(?:κατι διαφορετικ|kati diaforetik|something different|different from the usual)/i.test(text)){if(d.crowdLevel<=3)delta+=3;if(d.tags.includes("culture")||d.tags.includes("nature"))delta+=2;}\n return delta;\n}\n'''
          assert anchor in s, 'consideredFit anchor missing'
          s=s.replace(anchor,add,1)
          old=' let score=b.intent*w.intent+b.season*w.season+b.effort*w.effort+b.duration*w.duration+b.budget*w.budget+b.weather*w.weather+b.traveler*w.traveler+b.crowdFit*w.crowd;\n'
          new=old+' score+=freeTextPreferenceAdjustment(r,d,e.score);\n'
          assert old in s, 'score anchor missing'
          s=s.replace(old,new,1)
          old='export function preRankV8(r:TripRequest,intent:V8IntentProfile,catalog:V8Destination[],limit=30){const geo=geographyConstraint(r,catalog),eligible=catalog.filter(d=>matchesGeographyConstraint(d,geo)&&(r.distancePreference!=="island"||V8_ISLAND_SLUGS.has(d.slug))&&matchesMustHave(r,d)&&(r.avoid!=="crowds"||d.crowdLevel<5)&&(r.avoid!=="high-cost"||d.costTier<5));return eligible.map(d=>compute(r,intent,d,null)).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,Math.max(12,limit))}\n'
          new='''export function preRankV8(r:TripRequest,intent:V8IntentProfile,catalog:V8Destination[],limit=30){\n const geo=geographyConstraint(r,catalog),eligible=catalog.filter(d=>matchesGeographyConstraint(d,geo)&&(r.distancePreference!=="island"||V8_ISLAND_SLUGS.has(d.slug))&&matchesMustHave(r,d)&&(r.avoid!=="crowds"||d.crowdLevel<5)&&(r.avoid!=="high-cost"||d.costTier<5)),ranked=eligible.map(d=>compute(r,intent,d,null)).filter(x=>x.score>0).sort((a,b)=>b.score-a.score),size=Math.max(12,limit),selected=ranked.slice(0,size);\n const considered=ranked.find(item=>consideredFit(r,item.destination)&&item.breakdown.season>=55&&item.breakdown.budget>=48&&item.breakdown.crowdFit>30);\n if(considered&&!selected.some(item=>item.destination.slug===considered.destination.slug)){if(selected.length>=size)selected[selected.length-1]=considered;else selected.push(considered);}\n return selected;\n}\n'''
          assert old in s, 'preRank anchor missing'
          s=s.replace(old,new,1)
          old='export function diversifyV8(ranked:V8Ranked[],count=12){const pool=ranked.filter(item=>item.score>0).map(item=>({...item})),selected:V8Ranked[]=[];if(!pool.length)return selected;const targetCount=Math.min(count,pool.length),regionCap=regionCapFor(pool,targetCount);selected.push({...pool.shift()!,explorationRole:"BEST_FIT"});\n'
          new='export function diversifyV8(ranked:V8Ranked[],count=12,request?:TripRequest){const pool=ranked.filter(item=>item.score>0).map(item=>({...item})),selected:V8Ranked[]=[];if(!pool.length)return selected;const targetCount=Math.min(count,pool.length),regionCap=regionCapFor(pool,targetCount);selected.push({...pool.shift()!,explorationRole:"BEST_FIT"});\n'
          assert old in s, 'diversify signature missing'
          s=s.replace(old,new,1)
          old=' while(selected.length<count&&pool.length){if(!pick(pool,selected,"ALTERNATIVE",()=>true,item=>item.score,regionCap))break}\n return selected;\n}\n'
          new=''' while(selected.length<count&&pool.length){if(!pick(pool,selected,"ALTERNATIVE",()=>true,item=>item.score,regionCap))break}\n if(request?.consideredDestination){\n  const wanted=ranked.find(item=>consideredFit(request,item.destination)&&item.score>0&&item.breakdown.season>=55&&item.breakdown.budget>=48&&item.breakdown.crowdFit>30);\n  if(wanted&&!selected.some(item=>item.destination.slug===wanted.destination.slug)){const preserved={...wanted,explorationRole:"ALTERNATIVE" as V8ExplorationRole};if(selected.length<targetCount)selected.push(preserved);else if(selected.length>3)selected[selected.length-1]=preserved;}\n }\n return selected;\n}\n'''
          assert old in s, 'diversify end missing'
          s=s.replace(old,new,1)
          p.write_text(s)

          # 2) Orchestrator and auditor must carry the user's considered idea through repair/diversification.
          p=Path('lib/ai/travel-orchestrator-v15.ts');s=p.read_text()
          old='function repair(selected:V8Ranked[],pool:V8Ranked[],reject:string[]){if(!reject.length)return selected;const bad=new Set(reject);return diversifyV8(pool.filter(item=>!bad.has(item.destination.slug)),12)}'
          new='function repair(request:TripRequest,selected:V8Ranked[],pool:V8Ranked[],reject:string[]){if(!reject.length)return selected;const bad=new Set(reject);return diversifyV8(pool.filter(item=>!bad.has(item.destination.slug)),12,request)}'
          assert old in s;s=s.replace(old,new,1)
          old='const selected=diversifyV8(ranked,12),selectedIds=new Set(selected.map(x=>x.destination.slug)),verifyPool=[...selected,...ranked.filter(x=>!selectedIds.has(x.destination.slug))].slice(0,18);'
          new='const selected=diversifyV8(ranked,12,trip),selectedIds=new Set(selected.map(x=>x.destination.slug)),verifyPool=[...selected,...ranked.filter(x=>!selectedIds.has(x.destination.slug))].slice(0,18);'
          assert old in s;s=s.replace(old,new,1)
          old='const verification=await verifyV8(trip,verifyPool,llmBudget),fixed=verification.checked&&!verification.passed?repair(selected,ranked,verification.rejectSlugs):selected;mark("verifier");'
          new='const verification=await verifyV8(trip,verifyPool,llmBudget),fixed=verification.checked&&!verification.passed?repair(trip,selected,ranked,verification.rejectSlugs):selected;mark("verifier");'
          assert old in s;s=s.replace(old,new,1);p.write_text(s)

          p=Path('lib/ai/result-auditor-v10.ts');s=p.read_text();old='items=diversifyV8(survivors,limit);';new='items=diversifyV8(survivors,limit,request);';assert old in s;s=s.replace(old,new,1);p.write_text(s)

          p=Path('scripts/v17-1000-choice-audit.ts');s=p.read_text();old='return diversifyV8(finalRankV8(request,intent,pre,evidence),12)}';new='return diversifyV8(finalRankV8(request,intent,pre,evidence),12,request)}';assert old in s;s=s.replace(old,new,1);p.write_text(s)

          # 3) Deterministic intent parser: more of the user's natural-language nuance should matter before any LLM escalation.
          p=Path('lib/ai/intent-v8.ts');s=p.read_text()
          anchor=' if(has(free,/χωρις πολ.{0,12}οδηγ|λιγη οδηγ|not much driv|less driv|xwris pol.{0,12}odig|lig.{0,8}odig/)){w.short_break=Math.max(w.short_break,.65);w.relax=Math.max(w.relax,.55)}\n'
          extra=anchor+''' if(has(free,/tourist trap|τουριστοπαγ|no party crowds|not chaos|χωρις πολυ κοσμο|oxi poly kosmo/)){w.relax=Math.max(w.relax,.9);w.nature=Math.max(w.nature,.42);w.culture=Math.max(w.culture,.5)}\n if(has(free,/easy rhythm|slow morning|μαραθωνιο|marathon|χωρις πολυ αγχος|xwris poly agxos/)){w.relax=Math.max(w.relax,.92);w.wellness=Math.max(w.wellness,.5);w.short_break=Math.max(w.short_break,.55)}\n if(has(free,/walkable|βολτα|volta/)){w.city=Math.max(w.city,.55);w.culture=Math.max(w.culture,.45);w.short_break=Math.max(w.short_break,.4)}\n if(has(free,/local tavern|ταβερν|taverna/)){w.food=Math.max(w.food,.9);w.culture=Math.max(w.culture,.65)}\n if(has(free,/not a generic resort|generic resort|οχι resort/))w.culture=Math.max(w.culture,.82);\n if(has(free,/κατι διαφορετικ|kati diaforetik|something different|different from the usual/)){w.adventure=Math.max(w.adventure,.58);w.culture=Math.max(w.culture,.38)}\n'''
          assert anchor in s, 'intent nuance anchor missing';s=s.replace(anchor,extra,1);p.write_text(s)

          # 4) Explicit share buttons instead of a single generic action.
          p=Path('components/travel-decision-experience.tsx');s=p.read_text()
          old='''function ShareTools({ recommendation, trip, lang }: { recommendation: V8Recommendation; trip: TripRequest; lang: Lang }) {
  const [status, setStatus] = useState<"idle" | "shared" | "copied">("idle");
  const giveawayActive = process.env.NEXT_PUBLIC_GIVEAWAY_ACTIVE === "true" && Boolean(process.env.NEXT_PUBLIC_GIVEAWAY_TERMS_PATH);
  async function share() {
    const url = new URL(`/proorismoi/${recommendation.slug}`, window.location.origin);
    url.searchParams.set("start", trip.startDate);
    url.searchParams.set("end", trip.endDate);
    const title = say(lang, `${recommendation.destination}: λες να είναι το επόμενο ταξίδι;`, `${recommendation.destination}: could this be the next trip?`);
    const text = say(lang, "Ο Ελληνικός AI Travel Guru την έβαλε στις τελικές επιλογές μου. Δες γιατί.", "The Greek AI Travel Guru shortlisted it for me. See why.");
    let channel: "native" | "clipboard" = "clipboard";
    try {
      if (navigator.share) { await navigator.share({ title, text, url: url.toString() }); channel = "native"; setStatus("shared"); }
      else { await navigator.clipboard.writeText(url.toString()); setStatus("copied"); }
      void fetch("/api/growth/track", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ eventName: "social_share", destinationId: recommendation.slug, channel }), keepalive: true });
    } catch { return; }
  }
  return <aside className="share-tools"><div><span className="eyebrow"><ShareNetwork size={18} weight="duotone" /> {say(lang, "ΜΟΙΡΑΣΟΥ ΤΗΝ ΙΔΕΑ", "SHARE THE IDEA")}</span><h3>{say(lang, "Ένα ταξίδι γίνεται πιο αληθινό όταν το συζητάς.", "A trip becomes more real when you talk about it.")}</h3><p>{say(lang, "Η κοινοποίηση ανοίγει με ειδική εικόνα του προορισμού και οδηγεί μόνο στη δική του εσωτερική σελίδα.", "The share opens with a destination card and points only to its internal page.")}</p>{giveawayActive && <small>{say(lang, "Η κοινοποίηση μπορεί να μετρήσει ως συμμετοχή μόνο σύμφωνα με τους επίσημους όρους της ενεργής ενέργειας.", "A share may count as an entry only under the official terms of the active campaign.")}</small>}</div><button type="button" onClick={() => void share()}><ShareNetwork size={20} weight="bold" /> {status === "copied" ? say(lang, "Ο σύνδεσμος αντιγράφηκε", "Link copied") : status === "shared" ? say(lang, "Μοιράστηκε", "Shared") : say(lang, "Μοιράσου το ταξίδι", "Share this trip")}</button></aside>;
}
'''
          new='''function ShareTools({ recommendation, trip, lang }: { recommendation: V8Recommendation; trip: TripRequest; lang: Lang }) {
  const [status, setStatus] = useState<"idle" | "shared" | "copied">("idle");
  const giveawayActive = process.env.NEXT_PUBLIC_GIVEAWAY_ACTIVE === "true" && Boolean(process.env.NEXT_PUBLIC_GIVEAWAY_TERMS_PATH);
  function payload(){const url=new URL(`/proorismoi/${recommendation.slug}`,window.location.origin);url.searchParams.set("start",trip.startDate);url.searchParams.set("end",trip.endDate);return{url:url.toString(),title:say(lang,`${recommendation.destination}: λες να είναι το επόμενο ταξίδι;`,`${recommendation.destination}: could this be the next trip?`),text:say(lang,"Ο Ελληνικός AI Travel Guru την έβαλε στις τελικές επιλογές μου. Δες γιατί.","The Greek AI Travel Guru shortlisted it for me. See why.")};}
  function record(channel:string){void fetch("/api/growth/track",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({eventName:"social_share",destinationId:recommendation.slug,channel}),keepalive:true});}
  function openChannel(channel:string,target:string){window.open(target,"_blank","noopener,noreferrer");record(channel);setStatus("shared");}
  function whatsapp(){const {url,text}=payload();openChannel("whatsapp",`https://wa.me/?text=${encodeURIComponent(`${text}\n${url}`)}`);}
  function facebook(){const {url}=payload();openChannel("facebook",`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`);}
  async function copyLink(){const {url}=payload();try{await navigator.clipboard.writeText(url);setStatus("copied");record("copy");}catch{return;}}
  async function shareMore(){const {url,title,text}=payload();try{if(navigator.share){await navigator.share({title,text,url});setStatus("shared");record("native");}else await copyLink();}catch{return;}}
  return <aside className="share-tools"><div><span className="eyebrow"><ShareNetwork size={18} weight="duotone" /> {say(lang,"ΜΟΙΡΑΣΟΥ ΤΗΝ ΙΔΕΑ","SHARE THE IDEA")}</span><h3>{say(lang,"Στείλε τη συγκεκριμένη επιλογή στην παρέα σου.","Send this exact choice to your travel group.")}</h3><p>{say(lang,"Ο σύνδεσμος κρατά τον προορισμό και τις ημερομηνίες σου — όχι μια γενική αρχική σελίδα.","The link keeps your destination and dates — not a generic homepage.")}</p>{giveawayActive&&<small>{say(lang,"Η κοινοποίηση μπορεί να μετρήσει ως συμμετοχή μόνο σύμφωνα με τους επίσημους όρους της ενεργής ενέργειας.","A share may count as an entry only under the official terms of the active campaign.")}</small>}</div><div className="share-actions" aria-label={say(lang,"Επιλογές κοινοποίησης","Share options")}><button type="button" className="share-whatsapp" onClick={whatsapp}>WhatsApp</button><button type="button" className="share-facebook" onClick={facebook}>Facebook</button><button type="button" className="share-copy" onClick={()=>void copyLink()}>{status==="copied"?say(lang,"Αντιγράφηκε ✓","Copied ✓"):say(lang,"Αντιγραφή link","Copy link")}</button><button type="button" className="share-more" onClick={()=>void shareMore()}><ShareNetwork size={18} weight="bold"/>{say(lang,"Άλλα…","More…")}</button></div></aside>;
}
'''
          assert old in s, 'ShareTools anchor missing';s=s.replace(old,new,1);p.write_text(s)

          css=Path('app/v8.css');c=css.read_text();marker='/* V17 explicit share actions */';assert marker not in c
          c+='''\n\n/* V17 explicit share actions */\n.share-actions{flex:0 0 auto;display:grid;grid-template-columns:repeat(2,minmax(118px,1fr));gap:8px;min-width:300px}.share-actions button{min-height:46px;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:0 15px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;font-weight:850;cursor:pointer;transition:.18s ease}.share-actions button:hover{transform:translateY(-1px)}.share-whatsapp{background:#eefbf3;color:#17683b}.share-facebook{background:#eef4ff;color:#244b8f}.share-copy{background:rgba(255,255,255,.08);color:#fff}.share-more{background:var(--cyan);color:var(--night)}\n@media(max-width:760px){.share-actions{width:100%;min-width:0;grid-template-columns:1fr 1fr}.share-actions button{width:100%}}\n''';css.write_text(c)
          PY
      - run: npm install
      - run: npm run typecheck
