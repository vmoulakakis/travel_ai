name: Deploy Command

on:
  issues:
    types: [opened]

concurrency:
  group: travel-ai-production-command
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.issue.title == '[deploy] travel-ai production'
    runs-on: ubuntu-latest
    environment: Production – travel-ai
    env:
      VERCEL_ORG_ID: team_jt3jd1HJUB4sK1oZdl9MUYGs
      VERCEL_PROJECT_ID: prj_wGO5Tq3kQxrUMi7WA3lvTHxTNGhn
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Require Vercel credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is missing."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:strict

      - name: Pull Vercel production environment
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        shell: bash
        run: |
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "Production deployment: $url"
