name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Show lockfile sync diff
        run: git diff -- package-lock.json || true
      - run: npm run typecheck
      - run: npm run test:strict
      - run: npm run build
