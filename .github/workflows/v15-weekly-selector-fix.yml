name: V15 weekly selector one-shot fix

on:
  push:
    branches: [agent/v15-inventory-grounded-agentic-ux]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Normalize weekly pick city selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v15-inventory-grounded-agentic-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use weekly destination slug
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('components/travel-decision-experience.tsx')
          text=path.read_text()
          old='consideredDestination:weeklyPick.destination'
          new='consideredDestination:weeklyPick.slug'
          assert text.count(old)==1, f'expected one weekly destination state assignment, found {text.count(old)}'
          text=text.replace(old,new,1)
          path.write_text(text)
          PY
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:v15:architecture
      - run: git diff --check
      - name: Commit weekly selector fix
        run: |
          git config user.name "travel-ai-web-design-auditor"
          git config user.email "68458826+vmoulakakis@users.noreply.github.com"
          git add components/travel-decision-experience.tsx
          git commit -m "Keep weekly pick synced with inventory city selector [ui-fix]"
          git push origin HEAD:agent/v15-inventory-grounded-agentic-ux
